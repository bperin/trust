name: Release

# Every push to main creates the next release with compiled attestation demo
# assets. A manual run can add assets to an existing version from its tag.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v0.3.0). Leave empty for next patch version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release main
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' && (!contains(github.event.head_commit.message, '[skip ci]') || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Determine release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION}"
          else
            latest="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
            latest="${latest:-v0.0.0}"
            if [[ ! "${latest}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported latest release tag: ${latest}" >&2
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="v${major}.${minor}.$((patch + 1))"
          fi

          [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: ${version}" >&2
            exit 1
          }

          existing=false
          source_sha="${GITHUB_SHA}"
          if git rev-parse --verify --quiet "refs/tags/${version}" >/dev/null; then
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" || -z "${REQUESTED_VERSION}" ]]; then
              echo "Tag ${version} already exists; refusing automatic overwrite." >&2
              exit 1
            fi
            existing=true
            source_sha="$(git rev-list -n 1 "refs/tags/${version}")"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "existing=${existing}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "Packaging ${version} from ${source_sha}"

      - name: Build release executables
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
        run: |
          set -euo pipefail
          git checkout --detach "${SOURCE_SHA}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            IFS=/ read -r goos goarch <<< "${target}"
            name="trust-attestation-demo_${VERSION}_${goos}_${goarch}"
            if [[ "${goos}" == "windows" ]]; then
              name="${name}.exe"
            fi
            GOOS="${goos}" GOARCH="${goarch}" CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' -o "dist/${name}" ./cmd/attestation
          done
          (cd dist && sha256sum trust-attestation-demo_* > SHA256SUMS)

      - name: Create release tag
        if: steps.version.outputs.existing == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ steps.version.outputs.source_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${VERSION}" \
            -f "sha=${SOURCE_SHA}"

      - name: Publish and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          build="$(cat BUILD_NUMBER 2>/dev/null || echo unknown)"
          args=(--title "${VERSION}" --generate-notes --verify-tag --notes "Build: ${build}")
          if [[ "${VERSION}" == *-* ]]; then
            args+=(--prerelease)
          fi
          if ! gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release create "${VERSION}" dist/* "${args[@]}"
          fi
          for asset in dist/*; do
            name="$(basename "${asset}")"
            want="sha256:$(sha256sum "${asset}" | cut -d ' ' -f 1)"
            got="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" \
              --jq ".assets[] | select(.name == \"${name}\") | .digest")"
            if [[ -z "${got}" ]]; then
              gh release upload "${VERSION}" "${asset}"
              got="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" \
                --jq ".assets[] | select(.name == \"${name}\") | .digest")"
            fi
            if [[ "${got}" != "${want}" ]]; then
              echo "Release asset ${name} digest mismatch: got ${got}, expected ${want}" >&2
              exit 1
            fi
          done
