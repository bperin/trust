name: Release

# Triggered by semver tags: v0.1.0, v0.2.0, etc.
# Go modules are published by the tag itself — the Go proxy fetches the
# tag from GitHub. This workflow validates the tagged module builds and
# tests, runs govulncheck, and creates a GitHub Release to match.
#
# Branching rule: release tags must be on main commits. The workflow
# enforces this — a tag on dev will fail.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Validate and release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Verify tag is on main
        run: |
          git fetch origin main:main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" main; then
            echo "::error::Tag ${{ github.ref_name }} is not on main."
            echo "Per branching rules, release tags must be on main commits."
            echo "Merge dev -> main first, then tag the main commit."
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--title "${{ github.ref_name }}" --generate-notes --verify-tag)
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${{ github.ref_name }}" "${args[@]}"
