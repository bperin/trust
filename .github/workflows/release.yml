name: Release

# Every push to main creates the next release tag at the merged commit,
# then validates it and publishes the GitHub release.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v0.3.0). Leave empty for next patch version."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release main
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Determine release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin

          if [[ -n "${REQUESTED_VERSION}" ]]; then
            version="${REQUESTED_VERSION}"
          else
            latest="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
            latest="${latest:-v0.0.0}"
            if [[ ! "${latest}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported latest release tag: ${latest}" >&2
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="v${major}.${minor}.$((patch + 1))"
          fi

          [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release version: ${version}" >&2
            exit 1
          }

          if git rev-parse --verify --quiet "refs/tags/${version}" >/dev/null; then
            echo "Tag ${version} already exists; refusing to overwrite it." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Creating ${version} on ${GITHUB_SHA}"

      - name: Create release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${VERSION}" \
            -f "sha=${GITHUB_SHA}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          build="$(cat BUILD_NUMBER 2>/dev/null || echo unknown)"
          args=(--title "${VERSION}" --generate-notes --verify-tag --notes "Build: ${build}")
          if [[ "${VERSION}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${VERSION}" "${args[@]}"
