name: Build number

# Increments BUILD_NUMBER and rewrites the README build badge and Build
# section on every push to main. The bump commit carries [skip ci] so
# this workflow does not re-trigger itself.
#
# Branch protection: main requires PRs, so the default GITHUB_TOKEN must
# be allowed to bypass branch protection (Settings > Branches > main >
# bypass list, or a PAT with push access) for the push below to succeed.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-number-main
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Increment build number
        run: scripts/bump-build.sh

      - name: Commit and push
        run: |
          build="$(cat BUILD_NUMBER)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_NUMBER README.md
          git commit -m "bump build number to ${build} [skip ci]"
          git push
