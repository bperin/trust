name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC — catches new govulncheck findings
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Build, test, vet, vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
