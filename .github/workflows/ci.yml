name: CI

on:
  push:
    branches: [dev, master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Nightly at 03:00 UTC — catches new govulncheck findings
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  test:
    name: Build, test, vet, vulncheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [trust, auth, chain]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test -race -count=1 ./...

      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
