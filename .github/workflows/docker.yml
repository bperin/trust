name: Docker

on:
  push:
    branches: [dev, master]
    tags: ["v*"]
  schedule:
    # Nightly rebuild at 04:00 UTC
    - cron: "0 4 * * *"

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build image and run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build and test in Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: trust:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: docker run --rm trust:ci

      - name: Login to GHCR
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GHCR
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bperin/trust:latest
            ghcr.io/bperin/trust:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
